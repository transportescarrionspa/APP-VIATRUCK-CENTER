<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIATRUCK CENTER</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --orange:     #EA580C;
      --orange-l:   #F97316;
      --green:      #059669;
      --red:        #DC2626;
      --cyan:       #0891B2;
      --yellow:     #F59E0B;
      --bg0:        #080810;
      --bg1:        #111118;
      --bg2:        #16161f;
      --bg3:        #1c1c28;
      --border:     #2a2a3a;
      --text:       #f0f0f5;
      --text-dim:   #8888a0;
      --text-faint: #55556a;
      --mono:       'DM Mono', monospace;
      --sans:       'DM Sans', sans-serif;
    }

    body {
      background: radial-gradient(ellipse at 30% 20%, #1a0f08 0%, #080810 60%);
      font-family: var(--sans);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Phone Shell ── */
    .phone {
      width: 375px;
      height: 780px;
      background: var(--bg1);
      border-radius: 48px;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      box-shadow:
        0 0 0 1px #0a0a14,
        0 0 0 12px #13131e,
        0 0 0 14px #1e1e2c,
        0 40px 120px rgba(0,0,0,0.85),
        inset 0 0 0 1px rgba(255,255,255,0.04);
    }

    .screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      min-height: 0;
    }

    .scroll {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: none;
      min-height: 0;
    }
    .scroll::-webkit-scrollbar { display: none; }

    /* ── Base animations (v1, kept) ── */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes popIn {
      0%  { transform: scale(0.4); opacity: 0; }
      70% { transform: scale(1.12); opacity: 1; }
      100%{ transform: scale(1); }
    }
    @keyframes pulse {
      0%,100% { opacity: 1; transform: scale(1); }
      50%      { opacity: 0.4; transform: scale(0.75); }
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateX(-14px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    @keyframes burst {
      0%   { transform: translate(var(--tx),var(--ty)) scale(1); opacity: 1; }
      100% { transform: translate(calc(var(--tx)*3),calc(var(--ty)*3)) scale(0); opacity: 0; }
    }
    @keyframes checkPop {
      0%  { transform: scale(0) rotate(-30deg); opacity: 0; }
      60% { transform: scale(1.2) rotate(5deg); opacity: 1; }
      100%{ transform: scale(1) rotate(0deg); }
    }
    @keyframes progressGlow {
      0%,100% { box-shadow: 0 0 6px rgba(234,88,12,0.5); }
      50%      { box-shadow: 0 0 14px rgba(234,88,12,0.9); }
    }

    /* ── v2 UX animations ── */
    @keyframes slideFromRight {
      from { transform: translateX(60px); opacity: 0; }
      to   { transform: translateX(0);    opacity: 1; }
    }
    @keyframes slideFromLeft {
      from { transform: translateX(-40px); opacity: 0; }
      to   { transform: translateX(0);     opacity: 1; }
    }
    @keyframes sheetUp {
      from { transform: translateY(100%); }
      to   { transform: translateY(0);    }
    }
    @keyframes backdropIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes toastIn {
      from { transform: translateY(-16px) scale(.95); opacity: 0; }
      to   { transform: translateY(0)     scale(1);   opacity: 1; }
    }
    @keyframes toastOut {
      from { transform: translateY(0)     scale(1);   opacity: 1; }
      to   { transform: translateY(-16px) scale(.95); opacity: 0; }
    }
    @keyframes typingDot {
      0%,60%,100% { transform: translateY(0);    opacity: .35; }
      30%          { transform: translateY(-5px); opacity: 1;   }
    }
    @keyframes loginSlide {
      from { transform: translateY(30px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }

    .nav-forward { animation: slideFromRight .3s cubic-bezier(.22,.68,0,1.2) both; }
    .nav-back    { animation: slideFromLeft  .3s cubic-bezier(.22,.68,0,1.2) both; }
    .nav-tab     { animation: fadeInUp       .3s cubic-bezier(.22,.68,0,1.2) both; }
    .anim-fade   { animation: fadeInUp       .35s cubic-bezier(.22,.68,0,1.2) both; }
  </style>
</head>
<body>
<div id="root"></div>

/* ════════════════════════════════════════════════════════
   UTILS
════════════════════════════════════════════════════════ */
const clp  = n => new Intl.NumberFormat('es-CL',{style:'currency',currency:'CLP',minimumFractionDigits:0}).format(n);
const nowT = () => { const d=new Date(); return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; };

const ESTADO = {
  operativo: { lbl:"OPERATIVO",       col:"#059669", bg:"rgba(5,150,105,.14)"   },
  en_taller: { lbl:"EN TALLER",       col:"#EA580C", bg:"rgba(234,88,12,.14)"  },
  listo:     { lbl:"LISTO P/ RETIRO", col:"#0891B2", bg:"rgba(8,145,178,.14)"  },
  espera:    { lbl:"EN ESPERA",       col:"#8888a0", bg:"rgba(136,136,160,.14)" },
};
const NTIPO = {
  alerta: {icon:'🔔', col:'#F59E0B', bg:'rgba(245,158,11,.09)'},
  ok:     {icon:'✅', col:'#059669', bg:'rgba(5,150,105,.09)' },
  info:   {icon:'🚛', col:'#0891B2', bg:'rgba(8,145,178,.09)' },
  prox:   {icon:'📅', col:'#8888a0', bg:'rgba(136,136,160,.09)'},
};
const AUTO_REPLIES = [
  "Ya estamos trabajando en ello! 🔧",
  "Sin problemas, cualquier consulta me avisas.",
  "El camión va bien, no te preocupes 👍",

/* ════════════════════════════════════════════════════════
   SHARED PRIMITIVES
════════════════════════════════════════════════════════ */
const Btn = ({children,onClick,variant='primary',style={},disabled=false}) => {
  const [p,setP]=useState(false);
  const V={
    primary:{ background:'linear-gradient(135deg,#EA580C,#F97316)', color:'#fff', border:'none' },
    green:  { background:'linear-gradient(135deg,#059669,#10B981)', color:'#fff', border:'none' },
    ghost:  { background:'#1c1c28', color:'var(--text)', border:'1px solid var(--border)' },
    danger: { background:'transparent', color:'#DC2626', border:'1px solid rgba(220,38,38,.35)' },
  };
  return (
    <button onClick={onClick} disabled={disabled}
      onPointerDown={()=>setP(true)} onPointerUp={()=>setP(false)} onPointerLeave={()=>setP(false)}
      style={{
        width:'100%', padding:'15px', borderRadius:14,
        fontSize:15, fontWeight:700, fontFamily:'var(--sans)',
        cursor:disabled?'default':'pointer', letterSpacing:.3,
        opacity:disabled?.5:1,
        transform:p?'scale(0.96)':'scale(1)',
        transition:'transform .15s, opacity .2s',
        ...V[variant], ...style,
      }}>{children}</button>
  );
};

const BackBtn = ({onClick,label}) => {
  const [p,setP]=useState(false);
  return (
    <button onClick={onClick}
      onPointerDown={()=>setP(true)} onPointerUp={()=>setP(false)} onPointerLeave={()=>setP(false)}
      style={{
        display:'flex', alignItems:'center', gap:5,
        background:'var(--bg3)', border:'1px solid var(--border)', borderRadius:11,
        padding:'9px 14px', color:'var(--text)', cursor:'pointer', fontSize:14, fontWeight:600,
        flexShrink:0, transition:'transform .15s',
        transform:p?'scale(0.93)':'scale(1)',
      }}>
      <span style={{fontSize:16}}>‹</span>
      {label && <span style={{fontSize:13}}>{label}</span>}
    </button>
  );
};

const SectionLabel = ({children,style={}}) => (
  <div style={{fontSize:10,color:'var(--text-dim)',fontWeight:700,letterSpacing:1.4,marginBottom:10,...style}}>

);

const Particles = ({active}) => {
  if(!active) return null;
  return (
    <div style={{position:'absolute',top:'50%',left:'50%',pointerEvents:'none',zIndex:200}}>
      {Array.from({length:24},(_,i)=>{
        const angle=(i/24)*360, r=angle*Math.PI/180;
        const dist=50+Math.random()*70;
        return <div key={i} style={{
          position:'absolute', borderRadius:'50%',
          width:3+Math.random()*7, height:3+Math.random()*7,
          background:['#EA580C','#F97316','#059669','#0891B2','#FCD34D','#fff'][i%6],
          transform:'translate(-50%,-50%)',
          '--tx':`${Math.cos(r)*dist}px`, '--ty':`${Math.sin(r)*dist}px`,
          animation:`burst .9s ${Math.random()*.25}s ease-out forwards`,
        }}/>;
      })}
    </div>
  );
};

/* ════════════════════════════════════════════════════════
   STATUS BAR  (new v2)
════════════════════════════════════════════════════════ */
function StatusBar({dark=false}) {
  const [time,setTime] = useState(nowT());
  useEffect(()=>{
    const iv=setInterval(()=>setTime(nowT()),10000);
    return()=>clearInterval(iv);
  },[]);
  const tc = dark?'rgba(255,255,255,.35)':'rgba(255,255,255,.55)';
  return (
    <div style={{
      height:28, paddingInline:20,
      display:'flex', alignItems:'center', justifyContent:'space-between',
      flexShrink:0, userSelect:'none',
    }}>
      <span style={{fontFamily:'var(--mono)',fontSize:12,fontWeight:500,color:tc,letterSpacing:.5}}>{time}</span>
      <div style={{display:'flex',alignItems:'center',gap:6}}>
        {/* Signal bars */}
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none">
          {[0,1,2,3].map(i=>(
            <rect key={i} x={i*4} y={12-(i+1)*3} width="3" height={(i+1)*3} rx="1"
              fill={tc} opacity={i<3?1:.4}/>
          ))}
        </svg>
        {/* WiFi */}
        <svg width="15" height="12" viewBox="0 0 15 12" fill={tc}>
          <path d="M7.5 9.5a1.5 1.5 0 110 3 1.5 1.5 0 010-3z"/>
          <path d="M3.6 6.7a5.5 5.5 0 017.8 0" stroke={tc} strokeWidth="1.5" fill="none" strokeLinecap="round"/>
          <path d="M1 4.1a9 9 0 0113 0" stroke={tc} strokeWidth="1.5" fill="none" strokeLinecap="round" opacity=".6"/>
        </svg>
        {/* Battery */}
        <div style={{display:'flex',alignItems:'center',gap:1}}>
          <div style={{width:22,height:11,borderRadius:3,border:`1.5px solid ${tc}`,position:'relative',overflow:'hidden'}}>
            <div style={{position:'absolute',inset:1.5,right:'25%',background:tc,borderRadius:1.5}}/>
          </div>
          <div style={{width:2,height:5,borderRadius:'0 1px 1px 0',background:tc}}/>
        </div>
      </div>
    </div>
  );
}

/* ════════════════════════════════════════════════════════
   TOAST  (new v2)
════════════════════════════════════════════════════════ */
function Toast({toast}) {
  if(!toast) return null;
  const colors={
    success:{ bg:'#059669', icon:'✅' },
    info:   { bg:'#0891B2', icon:'ℹ️' },
    warn:   { bg:'#F59E0B', icon:'⚠️' },
  };
  const cfg=colors[toast.type]||colors.info;
  return (
    <div style={{
      position:'absolute', top:36, left:16, right:16, zIndex:300,
      background:cfg.bg,
      borderRadius:14, padding:'12px 16px',
      display:'flex', alignItems:'center', gap:10,
      boxShadow:'0 8px 28px rgba(0,0,0,.55)',
      animation:`${toast.leaving?'toastOut':'toastIn'} .3s cubic-bezier(.22,.68,0,1.2) both`,
    }}>
      <span style={{fontSize:18}}>{cfg.icon}</span>
      <span style={{fontSize:13,fontWeight:600,color:'white',flex:1}}>{toast.msg}</span>
    </div>
  );
}

/* ════════════════════════════════════════════════════════
   BOTTOM SHEET — Detalle de camión  (new v2)
════════════════════════════════════════════════════════ */
function BottomSheet({camion,onClose,onDiag,onOT,onHistorial}) {
  const cfg=ESTADO[camion.estado];
  const activo=camion.estado==='en_taller';
  const listo=camion.estado==='listo';
  return (
    <>
      {/* Backdrop */}
      <div onClick={onClose} style={{
        position:'absolute', inset:0, zIndex:60,
        background:'rgba(0,0,0,.65)',
        backdropFilter:'blur(4px)',
        animation:'backdropIn .25s ease both',
      }}/>
      {/* Sheet */}
      <div style={{
        position:'absolute', bottom:0, left:0, right:0, zIndex:61,
        background:'var(--bg2)',
        borderRadius:'28px 28px 0 0',
        border:'1px solid var(--border)',
        borderBottom:'none',
        animation:'sheetUp .38s cubic-bezier(.22,.68,0,1.2) both',
        overflow:'hidden',
      }}>
        {/* Handle */}
        <div style={{display:'flex',justifyContent:'center',padding:'12px 0 4px'}}>
          <div style={{width:40,height:4,borderRadius:2,background:'var(--border)'}}/>
        </div>

        <div style={{padding:'12px 20px 36px'}}>
          {/* Camion header */}
          <div style={{display:'flex',alignItems:'center',gap:14,marginBottom:18}}>
            <div style={{
              width:56,height:56,borderRadius:18,
              background:cfg.bg,
              display:'flex',alignItems:'center',justifyContent:'center',fontSize:30,
            }}>🚛</div>
            <div style={{flex:1}}>
              <div style={{fontFamily:'var(--mono)',fontSize:24,fontWeight:500,color:'var(--text)'}}>{camion.ppu}</div>
              <div style={{fontSize:13,color:'var(--text-dim)',marginTop:1}}>{camion.modelo} · {camion.year}</div>
            </div>
          </div>

          {/* Stats row */}
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:10,marginBottom:20}}>
            {[
              {lbl:'Kilometraje', val:`${(camion.km/1000).toFixed(0)}k km`},
              {lbl:'Año',         val:camion.year},
              {lbl:'Estado',      val:cfg.lbl, col:cfg.col},
            ].map(s=>(
              <div key={s.lbl} style={{
                background:'var(--bg3)',borderRadius:14,padding:'10px 12px',
                border:'1px solid var(--border)',
              }}>
                <div style={{fontSize:9,color:'var(--text-faint)',letterSpacing:1,marginBottom:4}}>{s.lbl.toUpperCase()}</div>
                <div style={{fontSize:12,fontWeight:700,color:s.col||'var(--text)',fontFamily:'var(--mono)'}}>{s.val}</div>
              </div>
            ))}
          </div>

          {/* Actions */}
          <div style={{display:'flex',flexDirection:'column',gap:10}}>
            {activo && (
              <>
                <Btn onClick={onDiag}>📋 Ver Diagnóstico</Btn>
                <Btn onClick={onOT} variant="ghost">🔧 Ver OT en progreso</Btn>
              </>
            )}
            {listo && (
              <Btn variant="green">✅ Camión listo para retiro</Btn>
            )}
            <Btn onClick={onHistorial} variant="ghost">📋 Historial de servicio</Btn>
          </div>
        </div>
      </div>
    </>
  );
}

/* ════════════════════════════════════════════════════════
   STEP INDICATOR  (new v2)
════════════════════════════════════════════════════════ */
function StepIndicator({steps, current}) {
  return (
    <div style={{display:'flex',alignItems:'center',gap:0,marginBottom:18}}>
      {steps.map((s,i)=>{
        const done=i<current, active=i===current;
        return (
          <React.Fragment key={s}>
            <div style={{
              display:'flex',alignItems:'center',gap:5,
              padding:'5px 10px', borderRadius:20,
              background: active?'rgba(234,88,12,.15)':done?'rgba(5,150,105,.1)':'transparent',
              border:`1px solid ${active?'rgba(234,88,12,.4)':done?'rgba(5,150,105,.3)':'transparent'}`,
              transition:'all .3s',
            }}>
              <div style={{
                width:18,height:18,borderRadius:'50%',flexShrink:0,
                background: done?'#059669': active?'#EA580C':'var(--bg3)',
                border:`2px solid ${done?'#059669':active?'#EA580C':'var(--border)'}`,
                display:'flex',alignItems:'center',justifyContent:'center',
                fontSize:10,color:'white',fontWeight:700,
                transition:'all .3s',
              }}>
                {done ? '✓' : i+1}
              </div>
              <span style={{
                fontSize:11,fontWeight:active?700:500,
                color:active?'#EA580C':done?'#059669':'var(--text-dim)',
                transition:'color .3s',
              }}>{s}</span>
            </div>
            {i<steps.length-1 && (
              <div style={{
                flex:1, height:1,
                background:i<current?'#059669':'var(--border)',
                transition:'background .3s',
              }}/>
            )}
          </React.Fragment>
        );
      })}
    </div>
  );
}

function NumKey({val,onTap}) {
  const [p,setP]=useState(false);
  return (
    <button onClick={onTap}
      onPointerDown={()=>setP(true)} onPointerUp={()=>setP(false)} onPointerLeave={()=>setP(false)}
      style={{
        padding:'14px 0',borderRadius:12,border:'none',
        background:val===''?'transparent':'var(--bg3)',
        color:'var(--text)',fontSize:val==='⌫'?18:22,
        fontWeight:500,fontFamily:'var(--sans)',
        cursor:val===''?'default':'pointer',
        transform:p?'scale(0.88)':'scale(1)',
        transition:'transform .1s',
      }}>{val}</button>
  );
}

        <label style={{fontSize:10,color:'var(--text-dim)',fontWeight:700,letterSpacing:1.3,display:'block',marginBottom:10}}>PIN DE ACCESO</label>
        <div style={{display:'flex',gap:10,justifyContent:'center',marginBottom:16}}>

          <span style={{fontSize:22,fontWeight:700,color:'#EA580C',fontFamily:'var(--mono)'}}>{clp(mode==='select'?selTotal:total)}</span>
        </div>
      </div>

      <div style={{display:'flex',flexDirection:'column',gap:10}}>
        <Btn onClick={approve} variant="green">✅ APROBAR TODO</Btn>
        <Btn onClick={()=>setMode(m=>m==='select'?'default':'select')} variant="ghost">
          {mode==='select'?'✓ CONFIRMAR SELECCIÓN':'⚙️ SELECCIONAR ÍTEMS'}
        </Btn>
        <Btn variant="danger">❌ RECHAZAR</Btn>
      </div>
    </div>
  );
}

/* ════════════════════════════════════════════════════════
   OT
════════════════════════════════════════════════════════ */
function OTScreen({camion,tareas,setTareas,listo,setListo,onChat,onBack}) {
  const [burst,setBurst]=useState(false);
  const doneCount=tareas.filter(t=>t.estado==='done').length;
  const pct=(doneCount/tareas.length)*100;

  useEffect(()=>{
    const iv=setInterval(()=>{
      setTareas(prev=>{
        const pi=prev.findIndex(t=>t.estado==='progress');
        const qi=prev.findIndex(t=>t.estado==='pending');
        if(pi===-1&&qi===-1){clearInterval(iv);return prev;}
        const next=[...prev];
        if(pi!==-1)next[pi]={...next[pi],estado:'done',hora:nowT()};
        if(qi!==-1)next[qi]={...next[qi],estado:'progress'};
        return next;
      });
    },4000);
    return()=>clearInterval(iv);
  },[]);

  useEffect(()=>{
    if(tareas.every(t=>t.estado==='done')&&!listo){
      setTimeout(()=>{setBurst(true);setTimeout(()=>{setBurst(false);setListo(true);},1000);},600);
    }
  },[tareas]);

  if(listo) return (
    <div style={{height:'100%',display:'flex',flexDirection:'column',alignItems:'center',
      justifyContent:'center',padding:28,textAlign:'center',position:'relative'}}>
      <Particles active/>
      <div style={{fontSize:80,marginBottom:16,animation:'popIn .6s cubic-bezier(.22,.68,0,1.2)'}}>🚛</div>
      <div style={{fontSize:24,fontWeight:700,color:'#059669',marginBottom:10}}>¡Listo para Retiro!</div>
      <div style={{fontSize:14,color:'var(--text-dim)',lineHeight:1.7}}>
        Tu camión <strong style={{color:'var(--text)',fontFamily:'var(--mono)'}}>{camion.ppu}</strong> está listo.<br/>
        Pasa a retirarlo en horario de atención.
      </div>
    </div>
  );

  return (
    <div style={{padding:'0 16px 20px',position:'relative'}}>
      <Particles active={burst}/>
      <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:18}}>
        <BackBtn onClick={onBack} label="Flota"/>
        <div style={{flex:1}}>
          <div style={{fontFamily:'var(--mono)',fontSize:11,color:'var(--text-dim)'}}>{DATA.ot.numero} · {DATA.ot.fecha}</div>
          <div style={{fontSize:16,fontWeight:700,color:'var(--text)'}}>{camion.ppu} — En progreso</div>
        </div>
      </div>

      <div style={{background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:18,
        padding:'14px 16px',marginBottom:14,display:'flex',alignItems:'center',gap:12}}>
        <div style={{width:48,height:48,borderRadius:14,flexShrink:0,
          background:'linear-gradient(135deg,#EA580C,#F97316)',
          display:'flex',alignItems:'center',justifyContent:'center',
          fontSize:16,fontWeight:700,color:'white'}}>RT</div>
        <div style={{flex:1}}>
          <div style={{fontSize:14,fontWeight:700,color:'var(--text)'}}>{DATA.mecanico.nombre}</div>
          <div style={{fontSize:12,color:'var(--text-dim)'}}>{DATA.mecanico.esp} · ⭐ {DATA.mecanico.rating}</div>
        </div>
        <div style={{textAlign:'right'}}>
          <div style={{fontSize:10,color:'var(--text-dim)'}}>ETA</div>
          <div style={{fontFamily:'var(--mono)',fontSize:15,fontWeight:700,color:'#0891B2'}}>{DATA.ot.eta}</div>
        </div>
      </div>

      <div style={{background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:18,padding:'14px 16px',marginBottom:18}}>
        <div style={{display:'flex',justifyContent:'space-between',marginBottom:10}}>
          <span style={{fontSize:13,fontWeight:600,color:'var(--text)'}}>Progreso</span>
          <span style={{fontFamily:'var(--mono)',fontSize:13,color:'#EA580C',fontWeight:600}}>{doneCount} / {tareas.length} tareas</span>
        </div>
        <div style={{height:10,background:'var(--bg3)',borderRadius:6,overflow:'hidden'}}>
          <div style={{
            height:'100%',borderRadius:6,
            background:'linear-gradient(90deg,#EA580C,#F97316)',
            width:`${pct}%`,
            transition:'width .9s cubic-bezier(.22,.68,0,1.2)',
            animation:doneCount>0?'progressGlow 2s infinite':undefined,
          }}/>
        </div>
        <div style={{fontSize:11,color:'var(--text-faint)',marginTop:7,textAlign:'right'}}>{Math.round(pct)}% completado</div>
      </div>

      <SectionLabel>TAREAS DE LA OT</SectionLabel>
      <div style={{display:'flex',flexDirection:'column',gap:8,marginBottom:16}}>
        {tareas.map(t=>(
          <div key={t.id} style={{
            background:'var(--bg2)',borderRadius:14,padding:'12px 14px',
            border:`1px solid ${t.estado==='progress'?'rgba(234,88,12,.35)':t.estado==='done'?'rgba(5,150,105,.25)':'var(--border)'}`,
            display:'flex',alignItems:'center',gap:12,
            opacity:t.estado==='pending'?.55:1,
            transition:'all .5s ease',
          }}>
            {t.estado==='done'&&<div style={{width:26,height:26,borderRadius:'50%',background:'#059669',display:'flex',alignItems:'center',justifyContent:'center',fontSize:14,color:'white',flexShrink:0,animation:'checkPop .3s ease'}}>✓</div>}
            {t.estado==='progress'&&<div style={{width:26,height:26,borderRadius:'50%',flexShrink:0,background:'rgba(234,88,12,.15)',border:'2px solid #EA580C',display:'flex',alignItems:'center',justifyContent:'center'}}>
              <div style={{width:9,height:9,borderRadius:'50%',background:'#EA580C',animation:'pulse 1.3s ease-in-out infinite'}}/>
            </div>}
            {t.estado==='pending'&&<div style={{width:26,height:26,borderRadius:'50%',flexShrink:0,background:'var(--bg3)',border:'2px solid var(--border)'}}/>}
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:13,color:t.estado==='done'?'var(--text-dim)':'var(--text)',fontWeight:t.estado==='progress'?600:400}}>{t.txt}</div>
            </div>
            <div style={{textAlign:'right',flexShrink:0}}>
              {t.hora&&<div style={{fontFamily:'var(--mono)',fontSize:11,color:'#059669'}}>{t.hora}</div>}
              {t.estado==='progress'&&<div style={{fontSize:9,fontWeight:700,color:'#EA580C',letterSpacing:.8}}>EN CURSO</div>}
            </div>
          </div>
        ))}
      </div>
      <Btn onClick={onChat} variant="ghost">💬 Chat con el mecánico</Btn>
    </div>
  );
}

/* ════════════════════════════════════════════════════════
   CHAT
════════════════════════════════════════════════════════ */
function ChatScreen({msgs,setMsgs,onBack}) {
  const [val,setVal]     = useState('');
  const [typing,setTyp]  = useState(false);
  const endRef           = useRef(null);

  const send=()=>{
    if(!val.trim())return;
    const h=nowT();
    setMsgs(m=>[...m,{id:Date.now(),de:'cli',txt:val,hora:h}]);
    setVal('');
    setTyp(true);
    const reply=AUTO_REPLIES[Math.floor(Math.random()*AUTO_REPLIES.length)];
    setTimeout(()=>{
      setTyp(false);
      setMsgs(m=>[...m,{id:Date.now()+1,de:'mec',txt:reply,hora:nowT()}]);
    },1800);
  };

  useEffect(()=>{ endRef.current?.scrollIntoView({behavior:'smooth'}); },[msgs,typing]);

  return (
    <div style={{display:'flex',flexDirection:'column',height:'100%'}}>
      <div style={{padding:'0 16px 12px',flexShrink:0}}>
        <div style={{display:'flex',alignItems:'center',gap:12}}>
          <BackBtn onClick={onBack} label="OT"/>
          <div style={{flex:1}}>
            <div style={{fontSize:14,fontWeight:700,color:'var(--text)'}}>{DATA.mecanico.nombre}</div>
            <div style={{fontSize:11,color:'#059669',display:'flex',alignItems:'center',gap:5}}>
              <span style={{width:6,height:6,borderRadius:'50%',background:'#059669',display:'inline-block',animation:'pulse 2s infinite'}}/>
              En línea · {DATA.mecanico.esp}
            </div>
          </div>
          <div style={{width:38,height:38,borderRadius:10,background:'linear-gradient(135deg,#EA580C,#F97316)',
            display:'flex',alignItems:'center',justifyContent:'center',fontSize:14,fontWeight:700,color:'white'}}>RT</div>
        </div>
      </div>

      <div style={{flex:1,overflowY:'auto',padding:'0 16px',display:'flex',flexDirection:'column',gap:10,scrollbarWidth:'none'}}>
        {msgs.map((m,i)=>(
          <div key={m.id} style={{
            display:'flex',flexDirection:'column',
            alignItems:m.de==='cli'?'flex-end':'flex-start',
            animation:i===msgs.length-1?'fadeInUp .3s ease':'none',
          }}>
            <div style={{
              maxWidth:'80%',padding:'10px 14px',borderRadius:18,
              background:m.de==='cli'?'linear-gradient(135deg,#EA580C,#F97316)':'var(--bg3)',
              border:m.de==='mec'?'1px solid var(--border)':'none',
              color:'var(--text)',fontSize:13,lineHeight:1.55,
              borderBottomRightRadius:m.de==='cli'?4:18,
              borderBottomLeftRadius:m.de==='mec'?4:18,
            }}>{m.txt}</div>
            <div style={{fontSize:10,color:'var(--text-faint)',marginTop:3,padding:'0 4px'}}>{m.hora}</div>
          </div>
        ))}
        {typing && <TypingIndicator/>}
        <div ref={endRef}/>
      </div>

      <div style={{padding:'10px 16px 24px',flexShrink:0,display:'flex',gap:10,background:'var(--bg1)',borderTop:'1px solid var(--border)'}}>
        <input value={val} onChange={e=>setVal(e.target.value)} onKeyDown={e=>e.key==='Enter'&&send()}
          placeholder="Escribe un mensaje..."
          style={{flex:1,padding:'12px 16px',borderRadius:14,background:'var(--bg3)',border:'1px solid var(--border)',color:'var(--text)',fontSize:13,fontFamily:'var(--sans)',outline:'none'}}
        />
        <button onClick={send} style={{width:48,height:48,borderRadius:14,border:'none',flexShrink:0,
          background:'linear-gradient(135deg,#EA580C,#F97316)',color:'white',fontSize:20,cursor:'pointer',
          display:'flex',alignItems:'center',justifyContent:'center'}}>↑</button>
      </div>
    </div>
  );
}

/* ════════════════════════════════════════════════════════
   TAB BAR
════════════════════════════════════════════════════════ */
function TabBar({view,setView,hasActivo,otProgreso}) {
  const TABS=[
    {id:'home',     icon:'🚛', lbl:'Flota'    },
    {id:'ot',       icon:'🔧', lbl:'OT Activa', locked:!hasActivo, badge:hasActivo&&otProgreso<100},
    {id:'chat',     icon:'💬', lbl:'Chat'     },
    {id:'historial',icon:'📋', lbl:'Historial'},
  ];
  return (
    <div style={{
      display:'flex',background:'var(--bg0)',
      borderTop:'1px solid rgba(255,255,255,.05)',
      padding:'6px 0 20px',flexShrink:0,
    }}>
      {TABS.map(t=>{
        const active=view===t.id;
        return (
          <button key={t.id}
            onClick={()=>!t.locked&&setView(t.id)}
            style={{
              flex:1,display:'flex',flexDirection:'column',alignItems:'center',
              gap:2,background:'none',border:'none',
              cursor:t.locked?'default':'pointer',
              opacity:t.locked?.35:1,padding:'6px 0',
              position:'relative',
            }}
          >
            {/* Active top bar */}
            {active && (
              <div style={{
                position:'absolute',top:-6,left:'30%',right:'30%',
                height:2,borderRadius:1,background:'#EA580C',
                animation:'fadeInUp .2s ease both',
              }}/>
            )}
            <div style={{
              position:'relative',
              fontSize:22,lineHeight:1,
              transform:active?'scale(1.15)':'scale(1)',
              transition:'transform .22s cubic-bezier(.22,.68,0,1.2)',
              filter:active?'none':'grayscale(.4) opacity(.65)',
            }}>
              {t.icon}
              {/* OT active badge */}
              {t.badge && (
                <div style={{
                  position:'absolute',top:-2,right:-4,
                  width:8,height:8,borderRadius:'50%',
                  background:'#EA580C',
                  border:'2px solid var(--bg0)',
                  animation:'pulse 2s infinite',
                }}/>
              )}
            </div>
            <div style={{
              fontSize:9,fontWeight:active?700:400,
              color:active?'#EA580C':'var(--text-faint)',
              letterSpacing:.4,
            }}>{t.lbl}</div>
          </button>
        );
      })}
    </div>
  );
}

/* ════════════════════════════════════════════════════════
   ROOT APP
════════════════════════════════════════════════════════ */
function App() {
  const [screen,setScreen]   = useState('login');
  const [empresa,setEmpresa] = useState(null);
  const [view,setView]       = useState('home');
  const [subView,setSubView] = useState(null);
  const [camion,setCamion]   = useState(null);
  const [showNotif,setNotif] = useState(false);
  const [sheet,setSheet]     = useState(null);   // bottom sheet camion
  const [toast,setToast]     = useState(null);   // { msg, type }
  const [navDir,setNavDir]   = useState('tab');
  const [tKey,setTKey]       = useState(0);

  /* Lifted state — persists across navigation */
  const [otTareas,setOtTareas] = useState(DATA.ot.tareas);
  const [otListo,setOtListo]   = useState(false);
  const [msgs,setMsgs]         = useState(DATA.msgs);

  const activo     = empresa?.camiones.find(c=>c.estado==='en_taller');
  const notifCount = DATA.notifs.filter(n=>n.nueva).length;
  const otProgreso = Math.round((otTareas.filter(t=>t.estado==='done').length/otTareas.length)*100);

  const showToast=(msg,type='success')=>{
    setToast({msg,type});
    setTimeout(()=>setToast(null),3000);
  };

  const navigate=(dir,fn)=>{
    setNavDir(dir);
    setTKey(k=>k+1);
    fn();
  };

  const goHome=()=>navigate('back',()=>{ setView('home');setSubView(null);setCamion(null); });

  const openSheet=(c)=>setSheet(c);
  const closeSheet=()=>setSheet(null);

  const fromSheet=(action)=>{
    closeSheet();
    setTimeout(()=>{
      if(action==='diag')      navigate('forward',()=>{ setCamion(sheet||activo); setSubView('diagnostico'); });
      if(action==='ot')        navigate('forward',()=>setView('ot'));
      if(action==='historial') navigate('forward',()=>{ setCamion(sheet); setSubView('historial-detail'); });
    },60);
  };

  const changeTab=(v)=>{
    navigate('tab',()=>{ setSubView(null); setCamion(null); setView(v); });
  };

  /* Login */
  if(screen==='login') return (
    <div className="phone">
      <StatusBar dark/>
      <div className="screen">
        <LoginScreen onLogin={emp=>{ setEmpresa(emp); navigate('forward',()=>setScreen('app')); }}/>
      </div>
    </div>
  );

  /* Render current screen content */
  const renderContent=()=>{
    if(showNotif)                           return <NotificacionesScreen onBack={()=>navigate('back',()=>setNotif(false))}/>;
    if(subView==='diagnostico'&&camion)     return <DiagnosticoScreen camion={camion} onNext={()=>navigate('forward',()=>setSubView('cotizacion'))} onBack={goHome}/>;
    if(subView==='cotizacion'&&camion)      return <CotizacionScreen camion={camion} onApprove={()=>{ showToast('¡Cotización aprobada! Trabajo iniciado ✅','success'); navigate('forward',()=>{ setSubView(null); setView('ot'); }); }} onBack={()=>navigate('back',()=>setSubView('diagnostico'))}/>;
    if(subView==='historial-detail'&&camion) return <HistorialScreen camion={camion} onBack={goHome}/>;
    if(view==='home')      return <HomeScreen empresa={empresa} onSelect={openSheet}/>;
    if(view==='ot')        return <OTScreen camion={activo||empresa.camiones[0]} tareas={otTareas} setTareas={setOtTareas} listo={otListo} setListo={setOtListo} onChat={()=>navigate('forward',()=>setView('chat'))} onBack={goHome}/>;
    if(view==='chat')      return <ChatScreen msgs={msgs} setMsgs={setMsgs} onBack={()=>navigate('back',()=>setView('ot'))}/>;
    if(view==='historial') return <HistorialScreen camion={activo||empresa.camiones[0]} onBack={goHome}/>;
  };

  const showTabBar=!showNotif&&!subView;
  const navClass=navDir==='forward'?'nav-forward':navDir==='back'?'nav-back':'nav-tab';

  return (
    <div className="phone">
      <StatusBar/>
      <Toast toast={toast}/>
      <div className="screen">
        <TopBar empresa={empresa} notifCount={notifCount} onNotif={()=>navigate('forward',()=>setNotif(true))}/>
        <div key={tKey} className={`scroll ${navClass}`}>
          {renderContent()}
        </div>
        {showTabBar && (
          <TabBar view={view} setView={changeTab} hasActivo={!!activo} otProgreso={otProgreso}/>
        )}
      </div>

      {/* Bottom Sheet overlay */}
      {sheet && (
        <BottomSheet
          camion={sheet}
          onClose={closeSheet}
          onDiag={()=>fromSheet('diag')}
          onOT={()=>fromSheet('ot')}
          onHistorial={()=>fromSheet('historial')}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
